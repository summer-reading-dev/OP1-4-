name: Deploy to GitHub Pages

on:
  push:
    branches:
      - "claude/op1-4-track-replica-qqlssr"
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, and mint the OIDC token
# that actions/deploy-pages exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The app is a single self-contained index.html, so the repo root
      # is the site — nothing to compile or bundle.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
